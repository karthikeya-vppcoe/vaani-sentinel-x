name: Vaani Sentinel X CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Test and Quality Checks
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 black mypy pytest pytest-cov
    
    - name: Create test environment
      run: |
        cp .env.template .env
        echo "GROQ_API_KEY=test_key" >> .env
        echo "JWT_SECRET=test_jwt_secret_with_32_characters_minimum" >> .env
        echo "SECRET_KEY=test_secret_key_with_32_characters_minimum" >> .env
    
    - name: Run health check
      run: python cli/command_center.py health
    
    - name: Run unit tests
      run: |
        python tests/test_system.py
        python tests/test_agents.py
    
    - name: Run agent tests
      run: python scripts/test_agents.py
    
    - name: Lint with flake8
      run: |
        flake8 agents/ cli/ config/ utils/ --max-line-length=88 --exclude=venv/ --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Check code formatting
      run: black --check agents/ cli/ config/ utils/ --line-length=88
    
    - name: Type checking
      run: mypy agents/ cli/ config/ utils/ --ignore-missing-imports
      continue-on-error: true  # Type checking is advisory

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  docker:
    name: Docker Build and Test
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t vaani-sentinel-x:test .
    
    - name: Test Docker image
      run: |
        docker run --rm vaani-sentinel-x:test python cli/command_center.py health
    
    - name: Test Docker Compose
      run: |
        cp .env.template .env
        echo "GROQ_API_KEY=test_key" >> .env
        echo "JWT_SECRET=test_jwt_secret_with_32_characters_minimum" >> .env
        echo "SECRET_KEY=test_secret_key_with_32_characters_minimum" >> .env
        docker-compose -f docker-compose.dev.yml config

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test, security, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ secrets.DOCKER_REGISTRY }}
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: ${{ secrets.DOCKER_REGISTRY }}
    
    - name: Build and push Docker image
      run: |
        docker build -t vaani-sentinel-x:${{ github.sha }} .
        docker tag vaani-sentinel-x:${{ github.sha }} vaani-sentinel-x:latest
        
        if [ -n "${{ secrets.DOCKER_REGISTRY }}" ]; then
          docker tag vaani-sentinel-x:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/vaani-sentinel-x:${{ github.sha }}
          docker tag vaani-sentinel-x:${{ github.sha }} ${{ secrets.DOCKER_REGISTRY }}/vaani-sentinel-x:latest
          docker push ${{ secrets.DOCKER_REGISTRY }}/vaani-sentinel-x:${{ github.sha }}
          docker push ${{ secrets.DOCKER_REGISTRY }}/vaani-sentinel-x:latest
        fi
    
    - name: Deploy to production
      run: |
        echo "Deployment step - configure with your deployment method"
        echo "Image tag: ${{ github.sha }}"
        # Add your deployment commands here (e.g., kubectl, terraform, etc.)